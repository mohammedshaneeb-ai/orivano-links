<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orivano – Links</title>
<meta name="description" content="Kerala banana chips, mixture & more">
<link rel="icon" href="logo.jpg">
<style>
  :root {
    --page: #353b24;
    --card: #353b24;
    --cream: #fff8e8;
    --cream-2: #efeadc;
    --ink: #2a2a1c;
    --maroon: #7a2630;
    --tagline: #f5f0e6;
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    min-height: 100vh;
    background: var(--page);
    display: flex; justify-content: center; align-items: center;
    padding: 20px;
    font-family: -apple-system, "Segoe UI", Roboto, "DejaVu Sans", sans-serif;
  }
  .card {
    width: 100%; max-width: 460px;
    background: var(--card);
    border-radius: 56px;
    padding: 56px 36px 52px;
    display: flex; flex-direction: column; align-items: center;
  }
  .logo {
    width: 200px; height: 200px; border-radius: 50%;
    object-fit: cover; display: block;
  }
  .tagline {
    margin: 40px 0 44px;
    font-family: Georgia, "DejaVu Serif", serif;
    font-size: 1.25rem; color: var(--tagline); text-align: center;
  }
  .links { width: 100%; display: flex; flex-direction: column; gap: 20px; }
  .btn {
    display: flex; align-items: center; justify-content: space-between;
    height: 72px; padding: 0 28px;
    background: var(--cream-2); color: var(--ink);
    border-radius: 999px; text-decoration: none;
    font-size: 1.3rem;
    transition: transform .15s ease, box-shadow .15s ease;
  }
  .btn.primary { background: var(--cream); }
  .btn:hover, .btn:focus-visible { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(0,0,0,.25); }
  .btn span { flex: 1; text-align: center; }
  .btn svg { width: 28px; height: 28px; stroke: var(--maroon); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  .btn .arrow { width: 20px; height: 20px; }
  .socials { display: flex; gap: 22px; margin-top: 48px; }
  .socials a {
    width: 58px; height: 58px; border-radius: 50%;
    border: 1.5px solid rgba(245,240,230,.45);
    display: grid; place-items: center; transition: background .15s;
  }
  .socials a:hover { background: rgba(255,255,255,.1); }
  .socials svg { width: 28px; height: 28px; stroke: var(--tagline); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  @media (max-width: 420px) {
    .card { border-radius: 40px; padding: 44px 22px 40px; }
    .btn { height: 64px; font-size: 1.15rem; padding: 0 22px; }
  }
</style>
</head>
<body>
<!-- SVG icon sprite -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2c3 3 4.5 6.5 4.5 10S15 19 12 22c-3-3-4.5-6.5-4.5-10S9 5 12 2z"/></symbol>
  <symbol id="i-insta" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r=".6"/></symbol>
  <symbol id="i-wa" viewBox="0 0 24 24"><path d="M3 21l1.6-4.6A9 9 0 1 1 8 19.5z"/><path d="M9 8c0 4 3 7 7 7l1-2-2.5-1-1 .8c-1-.4-2-1.4-2.4-2.4l.8-1L10.8 7z"/></symbol>
  <symbol id="i-yt" viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="4"/><path d="M10 9.5v5l4.5-2.5z"/></symbol>
  <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M6 18L18 6M8 6h10v10"/></symbol>
</svg>

<main class="card">
  <img class="logo" src="logo.jpg" alt="Orivano – where nature and taste meet">
  <p class="tagline">Kerala banana chips, mixture &amp; more</p>

  <nav class="links">
    <a class="btn primary" href="https://orivano.in" target="_blank" rel="noopener">
      <svg><use href="#i-globe"/></svg><span>Visit Website</span><svg class="arrow"><use href="#i-arrow"/></svg>
    </a>
    <a class="btn" href="https://www.instagram.com/orivano.in/" target="_blank" rel="noopener">
      <svg><use href="#i-insta"/></svg><span>Instagram</span><svg class="arrow"><use href="#i-arrow"/></svg>
    </a>
    <a class="btn" href="https://wa.me/918921242554" target="_blank" rel="noopener">
      <svg><use href="#i-wa"/></svg><span>WhatsApp</span><svg class="arrow"><use href="#i-arrow"/></svg>
    </a>
  </nav>

  <div class="socials">
    <a href="https://www.instagram.com/orivano.in/" target="_blank" rel="noopener" aria-label="Instagram"><svg><use href="#i-insta"/></svg></a>
    <a href="https://wa.me/918921242554" target="_blank" rel="noopener" aria-label="WhatsApp"><svg><use href="#i-wa"/></svg></a>
  </div>
</main>
</body>
</html>
